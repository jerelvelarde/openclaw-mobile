name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Quality (format, typecheck, lint, test, protocol build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          # Version is read from root package.json `packageManager`.
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier (format:check)
        run: pnpm format:check

      - name: TypeScript (typecheck across workspaces)
        run: pnpm -r typecheck

      - name: ESLint (lint across workspaces)
        run: pnpm -r lint

      - name: Tests (across workspaces)
        run: pnpm -r test

      - name: Build @openclaw/protocol
        run: pnpm --filter @openclaw/protocol build
